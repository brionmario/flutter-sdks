appId: dev.thunderid.Quickstart
---
# Fills and submits the full-screen ChangeCredential form, then waits for a successful submit to
# pop it back to the profile screen's credential row.
- extendedWaitUntil:
    visible:
      id: "thunderid-field-newCredential"
    timeout: 20000

# See signin.yaml's equivalent comment: a field can be on screen before the page's own transition
# (a fade, here) has actually finished settling, and typing into it mid-settle has been observed
# to bind an empty string.
- waitForAnimationToEnd:
    timeout: 3000

- tapOn:
    id: "thunderid-field-newCredential"
- inputText: ${NEW_PASSWORD}
- tapOn:
    id: "thunderid-field-confirmCredential"
- inputText: ${NEW_PASSWORD}

- tapOn:
    id: "thunderid-action-submitCredential"

# A successful submission pops the full-screen form back to the profile screen, so the field
# goes away rather than a new element appearing - that is what confirms the change went through.
- extendedWaitUntil:
    notVisible:
      id: "thunderid-field-newCredential"
    timeout: 20000
