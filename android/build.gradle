group 'dev.thunderid.flutter'
version '0.0.0'

buildscript {
    ext.kotlin_version = '2.2.20'
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.11.1'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

repositories {
    google()
    mavenCentral()
    maven {
        url 'https://storage.googleapis.com/download.flutter.io'
    }
    maven {
        url 'https://jitpack.io'
    }
}

apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'

android {
    namespace 'dev.thunderid.flutter'
    compileSdk 34

    defaultConfig {
        minSdk 26
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

def flutterSdkPath() {
    def envRoot = System.getenv('FLUTTER_ROOT')
    if (envRoot != null) {
        return envRoot
    }
    def localPropertiesFile = new File(rootDir, '../samples/quickstart/android/local.properties')
    def properties = new Properties()
    localPropertiesFile.withInputStream { properties.load(it) }
    def sdkPath = properties.getProperty('flutter.sdk')
    assert sdkPath != null, "flutter.sdk not set in local.properties"
    return sdkPath
}

def flutterEngineVersion = new File(flutterSdkPath(), 'bin/cache/engine.stamp').text.trim()

dependencies {
    compileOnly "io.flutter:flutter_embedding_debug:1.0.0-$flutterEngineVersion"
    // Pinned to the v0.2.0 release tag. The tag's commit is fixed, and unlike an arbitrary commit
    // SHA, its JitPack build is already warmed (it's the officially published version), avoiding
    // the cold-start build timeout/429 that an unbuilt SHA reference hits on first resolution.
    implementation 'com.github.thunder-id:android-sdks:v0.2.0'
    // Google Play Integrity — used by PlayIntegrityTokenProvider for platform attestation.
    implementation 'com.google.android.play:integrity:1.6.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
}
